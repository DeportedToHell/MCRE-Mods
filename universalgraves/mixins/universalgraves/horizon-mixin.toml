[mod]
id = "universalgraves"
version = "1.0.0"
# Before Accessories (100) at the level tick: a grave takes a dead player's
# accessories before Accessories drops them.
priority = 200

# Built for this Nightly: besides the hook points it hears a player's death
# inside the game's own `guest_die` (who dies, with their experience and the
# blow), fills the grave at the start of `drop_inventory` so nothing drops,
# keeps the death's experience out of `spawn_orbs`, and reads the death
# message from `native_player_died_v2`.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[module]]
id = "defaults"
file = "crates/horizon-client/src/game.rs"
name = "universalgraves_defaults"
source = "defaults.rs"

[[module]]
id = "text"
file = "crates/horizon-client/src/game.rs"
name = "universalgraves_text"
source = "text.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "universalgraves"
source = "glue.rs"

# ---- deaths ----

# Who is dying, at the start of `ServerPlayer.die` (`guest_die`).
[[injection]]
id = "guest_die"
target = "horizon_client::game::lan_actions::Game<'_>::guest_die"
kind = "HEAD"
helper = "h_guest_die.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&mut LanHost", value = "&mut *host" },
  { name = "gi", ty = "usize", value = "gi" },
  { name = "conn", ty = "u32", value = "conn" },
]

# The death message, as the game made it.
[[injection]]
id = "died_message"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_died_v2"
kind = "HEAD"
helper = "h_died_message.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "message", ty = "&horizon_client::text::Text", value = "message" },
]

# `dropAllDeathLoot`, before `dropEquipment`: the grave takes the inventory.
[[injection]]
id = "drop_inventory"
target = "horizon_client::game::item_entities::Game<'_>::drop_inventory"
kind = "HEAD"
helper = "h_drop_inventory.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "who", ty = "(u128, i32)", value = "who" },
]

# The death's experience, kept by the grave.
[[injection]]
id = "spawn_orbs"
target = "horizon_client::game::item_entities::Game<'_>::spawn_orbs"
kind = "HEAD"
cancellable = true
helper = "h_spawn_orbs.rs"
bindings = []

# ---- the server ----

# Each level's tick: graves placed, their models, timers, menus, actions.
[[injection]]
id = "level_tick"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "h_level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
