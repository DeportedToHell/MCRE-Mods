# The wandering trader's villager backpack (`villager_trade`): Horizon reads a
# content mod's trades only from the `minecraft` namespace, and a pack file of a
# native mod would rebuild every table at each world load, so it joins the
# game's own trade files as they are read.
[[injection]]
id = "trades"
target = "horizon_client::merchant::walk"
kind = "HEAD"
cancellable = true
helper = "h_trades.rs"
bindings = [
  { name = "dir", ty = "&Path", value = "dir" },
  { name = "out", ty = "&mut HashMap<String, Value>", value = "&mut *out" },
]

