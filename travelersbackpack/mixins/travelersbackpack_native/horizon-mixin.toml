[mod]
id = "travelersbackpack_native"
version = "0.9.7"
priority = 100

# Built for this Nightly: besides the hook points it opens a menu of the
# content mod's own type whose slots are a backpack's, not a block's (a module
# of the hub's container code, `lan/containers.rs`), and gives such a menu the
# mod's screen on the client (`open_native_screen`), which Horizon does only
# for a block's menu.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "spider"
file = "crates/horizon-client/src/motion.rs"
name = "travelersbackpack_spider"
source = "spider.rs"
visibility = "pub"

[[module]]
id = "screen_relayout"
file = "crates/horizon-client/src/game/native_hooks.rs"
name = "travelersbackpack_screen"
source = "screen_relayout.rs"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "travelersbackpack"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "travelersbackpack_glue"
source = "glue.rs"

# The server's half of a backpack's menu, beside the hub's own menus.
[[module]]
id = "menu"
file = "crates/horizon-client/src/lan/containers.rs"
name = "travelersbackpack_menu"
source = "menu.rs"
visibility = "pub"

[[injection]]
id = "use_item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "h_use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

