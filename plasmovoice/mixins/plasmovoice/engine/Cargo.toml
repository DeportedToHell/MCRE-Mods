# Plasmo Voice for Horizon: the voice chat engine (protocol, crypto, audio), a crate of the bundle.
# Dependencies are the versions in Horizon's Cargo.lock (docs/native-mods.md, "The mod's crate").
[package]
name = "plasmovoice-engine"
version = "1.0.3"
edition = "2024"
license = "LGPL-3.0-only"
publish = false

[dependencies]
aes = "0.8"
cbc = "0.1"
getrandom = "0.3"
rusty-opus = "1"
cpal = "0.16"
# The voice server's files (config.toml, voice_mutes.json, languages/) and log lines.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
log = "0.4"
serde_json = "1"
toml = "1.1"
