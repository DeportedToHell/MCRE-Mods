  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# The server's decoder lets Emotecraft's messages up to 1 MiB on its channel, as Emotecraft's
# own servers do (vanilla stops custom payloads at 32767 bytes; songs and big emotes are more).
[[injection]]
id = "checked_play"
target = "horizon_client::lan::conn::checked_play"
kind = "HEAD"
cancellable = true
helper = "h_checked_play.rs"
bindings = [
  { name = "packet", ty = "&play::Serverbound", value = "&packet" },
]

[[injection]]
id = "server_commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "h_server_commands.rs"
bindings = [
