name: 🐞 Bug report / Сообщить об ошибке
description: Something in one of our mods doesn't work. / Что-то в одном из наших модов не работает.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><img src="https://raw.githubusercontent.com/DeportedToHell/MCRE-Mods/main/.github/issues/bug.svg" alt="Found a bug? / Нашли ошибку?" width="100%"></p>

        <p align="center">Thanks for reporting! English or Russian. · Спасибо, что сообщаете! Можно по-русски.</p>
  - type: dropdown
    id: mod
    attributes:
      label: 🧩 Mod and version / Мод и версия
      description: The version is in Mod Menu or Options > Mods. Newest first. / Версия видна в Mod Menu или в Настройки > Моды. Новые сверху.
      options:
        - "Bad Wither No Cookie - Reloaded 1.0.3"
        - "Bad Wither No Cookie - Reloaded 1.0.2"
        - "Bad Wither No Cookie - Reloaded 1.0.1"
        - "Bad Wither No Cookie - Reloaded 1.0.0"
        - "Better Dynamic Lights 1.0.3"
        - "Better Dynamic Lights 1.0.2"
        - "Better Dynamic Lights 1.0.1"
        - "BetterF3 1.0.2"
        - "BetterF3 1.0.1"
        - "ClientSort 1.2.1"
        - "ClientSort 1.2.0"
        - "Clumps 1.0.2"
        - "Clumps 1.0.1"
        - "Clumps 1.0.0"
        - "Emotecraft 1.0.1"
        - "Emotecraft 1.0.0"
        - "Falling Leaves 1.0.1"
        - "Falling Leaves 1.0.0"
        - "First-person Model 1.0.2"
        - "First-person Model 1.0.1"
        - "InvMove 1.0.0"
        - "Just Enough Items 1.1.3"
        - "Just Enough Items 1.1.2"
        - "Just Enough Items 1.1.1"
        - "Just Enough Items 1.1.0"
        - "Mod Menu 1.1.2"
        - "Mod Menu 1.1.1"
        - "Mouse Tweaks 1.1.0"
        - "Particle Rain 1.0.1"
        - "Particle Rain 1.0.0"
        - "Pick Up Notifier 1.1.0"
        - "Ping Wheel 1.0.1"
        - "Ping Wheel 1.0.0"
        - "Plasmo Voice 1.0.2"
        - "Plasmo Voice 1.0.1"
        - "Plasmo Voice 1.0.0"
        - "Roughly Enough Items 1.1.2"
        - "Roughly Enough Items 1.1.1"
        - "Roughly Enough Items 1.1.0"
        - "Shulker Box Tooltip 1.0.1"
        - "Smooth Swapping 1.1.2"
        - "Smooth Swapping 1.1.1"
        - "Traveler's Backpack 0.9.9"
        - "Zoomify 1.1.1"
        - "Other or older version: say which in What happened / Другая или старая версия: укажите её в «Что случилось?»"
    validations:
      required: true
  - type: input
    id: horizon-version
    attributes:
      label: 🚀 Horizon version / Версия Horizon
      description: The launcher shows it. / Видна в лаунчере.
      placeholder: "Nightly 2026-11-08"
  - type: textarea
    id: what
    attributes:
      label: 💥 What happened? / Что случилось?
      description: What you expected and what you saw instead. Screenshots help a lot. / Что ожидали и что получилось. Скриншоты очень помогают.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 How to repeat it / Как повторить
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: others
    attributes:
      label: 📋 Other mods and the log / Другие моды и лог
      description: Which other mods you have on, and the game log if it crashed. / Какие ещё моды включены и лог игры, если она вылетела.
      render: text
