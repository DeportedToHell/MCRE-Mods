name: 🐞 Roughly Enough Items
description: Something in Roughly Enough Items doesn't work. / Что-то в Roughly Enough Items не работает.
title: "[Roughly Enough Items] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><img src="https://raw.githubusercontent.com/DeportedToHell/MCRE-Mods/main/.github/issues/bug.svg" alt="Found a bug? / Нашли ошибку?" width="100%"></p>

        <p align="center"><b>Roughly Enough Items</b> · Thanks for reporting! English or Russian. · Спасибо, что сообщаете! Можно по-русски.</p>
  - type: dropdown
    id: mod-version
    attributes:
      label: 🔢 Roughly Enough Items version / Версия Roughly Enough Items
      description: Mod Menu or Options > Mods shows it. Newest first. / Видна в Mod Menu или в Настройки > Моды. Новые сверху.
      options:
        - "1.1.3"
        - "1.1.2"
        - "1.1.1"
        - "1.1.0"
        - "Don't know / Не знаю"
    validations:
      required: true
  - type: input
    id: horizon-version
    attributes:
      label: 🚀 Horizon version / Версия Horizon
      description: The launcher shows it. / Видна в лаунчере.
      placeholder: "Nightly 2026-11-13"
  - type: textarea
    id: what
    attributes:
      label: 💥 What happened? / Что случилось?
      description: What you expected and what you saw instead. Screenshots help a lot. / Что ожидали и что получилось. Скриншоты очень помогают.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 🔁 How to repeat it / Как повторить
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: others
    attributes:
      label: 📋 Other mods and the log / Другие моды и лог
      description: Which other mods you have on, and the game log if it crashed. / Какие ещё моды включены и лог игры, если она вылетела.
      render: text
