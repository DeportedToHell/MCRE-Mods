# Ping Wheel for Horizon: the parts that don't touch the game (the packets on Java's byte layout,
# Java's String.hashCode, the server's relay rules and rate limiter, the config files in Gson's
# layout, the screen-edge maths), a crate of the bundle with its own unit tests.
# Dependencies are the versions in Horizon's Cargo.lock (docs/native-mods.md, "The mod's crate").
[package]
name = "pingwheel-core"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
