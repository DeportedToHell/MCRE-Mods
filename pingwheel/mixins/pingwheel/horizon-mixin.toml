# ---- the server half (single player, a LAN host, a dedicated server) ----

[[injection]]
id = "world"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "h_world.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "server_tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "h_server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::ServerTickPhase", value = "phase" },
]

[[injection]]
id = "logged_in"
hook = "player_logged_in"
hook_version = 1
kind = "HEAD"
helper = "h_logged_in.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
