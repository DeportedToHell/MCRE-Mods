# A guest's plugin message (not in the hook catalog at this commit: by its path).
[[injection]]
id = "payload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_custom_payload_from_client"
helper = "h_payload.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# /pingwheel:server: a name with a colon, which `register_commands` can't take, so heard as typed.
[[injection]]
id = "player_command"
hook = "player_command"
hook_version = 1
kind = "HEAD"
helper = "h_player_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
  { name = "replies", ty = "&mut Vec<horizon_client::text::Text>", value = "&mut *replies" },
]

# The dedicated server's console (not in the hook catalog at this commit: by its path).
[[injection]]
id = "console"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_console_line"
helper = "h_console.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "line", ty = "&str", value = "line" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
  { name = "replies", ty = "&mut Vec<horizon_client::text::Text>", value = "&mut *replies" },
]
