[mod]
id = "fallingleaves"
version = "1.0.0"
priority = 100

# Built for this Nightly: besides the hook points it adds to the particle
# engine and the ambient block tick, hooks the particle tick and the player's
# block breaking, and hides the Options screen under its settings screen.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The leaf particle, inside the particle engine (its roll and sprite).
[[module]]
id = "particle"
file = "crates/horizon-client-render/src/particles.rs"
name = "fallingleaves_particle"
visibility = "pub"
source = "particle.rs"

# The settings, the wind and where leaves start, beside the ambient tick.
[[module]]
id = "core"
file = "crates/horizon-client/src/animate_tick.rs"
name = "fallingleaves"
visibility = "pub"
source = "core.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "fallingleaves_glue"
source = "glue.rs"

[[module]]
id = "screen"
file = "crates/horizon-client/src/game.rs"
name = "fallingleaves_screen"
source = "screen.rs"

# The settings screen is Cloth Config's (cloth.rs, drawn with Cloth Config's
# texture, cloth_sprites.rs), as AutoConfig builds it for the mod (screen.rs).
[[module]]
id = "cloth"
file = "crates/horizon-client/src/game.rs"
name = "fallingleaves_cloth"
source = "cloth.rs"

[[module]]
id = "cloth_sprites"
file = "crates/horizon-client/src/game.rs"
name = "fallingleaves_cloth_sprites"
source = "cloth_sprites.rs"

# Each block's ambient tick: leaves fall the mod's way.
[[injection]]
id = "leaf_tick"
target = "horizon_client_lib::animate_tick::block_animate_tick"
kind = "HEAD"
cancellable = true
helper = "h_leaf_tick.rs"
bindings = [
  { name = "tables", ty = "&crate::animate_tick::AnimateTables", value = "tables" },
  { name = "engine", ty = "&mut crate::particles::ParticleEngine", value = "&mut *engine" },
  { name = "ctx", ty = "&crate::animate_tick::AnimateContext<'_>", value = "ctx" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# The particle tick: the wind, and the leaves the ambient tick asked for.
[[injection]]
id = "tick"
target = "horizon_client::game::render_tick::Game<'_>::tick_particles"
kind = "HEAD"
helper = "h_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "level_load"
hook = "client_level_load"
hook_version = 1
kind = "HEAD"
helper = "h_level_load.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "reloaded"
hook = "client_resources_reloaded"
hook_version = 1
kind = "HEAD"
helper = "h_reloaded.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# A leaf block decays on the single player's server.
[[injection]]
id = "decay"
hook = "leaves_decay"
hook_version = 1
kind = "HEAD"
helper = "h_decay.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
]

# Hitting a block: in single player the hand's start of a break, or a
# creative break; on a server the remote mining.
[[injection]]
id = "attack"
target = "horizon_client::game::hand::<GameHands<'_,'_> as HandWorld>::attack_block"
kind = "HEAD"
helper = "h_attack.rs"
bindings = [
  { name = "hands", ty = "&mut crate::game::hand::GameHands<'_, '_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "destroy"
target = "horizon_client::game::hand::<GameHands<'_,'_> as HandWorld>::destroy_block"
kind = "HEAD"
helper = "h_destroy.rs"
bindings = [
  { name = "hands", ty = "&mut crate::game::hand::GameHands<'_, '_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "remote_mining"
target = "horizon_client::game::remote::Game<'_>::remote_mining"
kind = "HEAD"
helper = "h_remote_mining.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "start", ty = "bool", value = "start" },
]

# Options > Mods and Mod Menu.
[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The settings screen over the options: drawn after them, and the options
# themselves held back while it covers them.
[[injection]]
id = "render"
hook = "screen_render_post"
hook_version = 1
kind = "HEAD"
helper = "h_render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "options_cover"
target = "horizon_client::game::options::Game<'_>::draw_options"
kind = "HEAD"
cancellable = true
helper = "h_options_cover.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The settings screen's mouse and keys, over the options.
[[injection]]
id = "press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "release"
hook = "screen_mouse_button_released_pre"
hook_version = 1
kind = "HEAD"
helper = "h_release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "drag"
hook = "screen_mouse_dragged_pre"
hook_version = 1
kind = "HEAD"
helper = "h_drag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
kind = "HEAD"
helper = "h_scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "key_pressed"
hook = "screen_key_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_key_pressed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "key_released"
hook = "screen_key_released_pre"
hook_version = 1
kind = "HEAD"
helper = "h_key_released.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "char"
hook = "screen_char_typed_pre"
hook_version = 1
kind = "HEAD"
helper = "h_char.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
